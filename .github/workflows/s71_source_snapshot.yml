name: S71 reproducible source-only research snapshot
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - .github/workflows/s71_source_snapshot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package public research Python and protocols only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          roots=('bubble_chamber/','scripts/research/bubble_chamber/','tests/','docs/bubble_chamber/','models/')
          extensions={'.py','.md','.json','.yaml','.yml','.txt','.html'}
          manifest={}
          with zipfile.ZipFile('s71_source_only.zip','w',zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for name in sorted(files):
                  if not name or not name.startswith(roots) or Path(name).suffix not in extensions:continue
                  raw=Path(name).read_bytes()
                  if len(raw)>2_000_000 or b'\x00' in raw:raise RuntimeError('Unsafe or binary source: '+name)
                  raw.decode('utf-8')
                  z.writestr(name,raw)
                  manifest[name]=hashlib.sha256(raw).hexdigest()
              z.writestr('SAFE_MANIFEST.json',json.dumps(manifest,sort_keys=True,indent=2))
          print('safe source count:',len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s71-source-only-snapshot
          path: s71_source_only.zip
          retention-days: 1
          if-no-files-found: error
