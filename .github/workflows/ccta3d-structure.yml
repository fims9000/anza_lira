name: CCTA 3D structure-aware ANZA vs CNN

on:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
    paths:
      - 'models/**'
      - 'scripts/research/ccta_graph_lira_safe_repair/**'
      - 'tests/test_ccta*'
      - 'tests/test_ct28*'
      - '.github/workflows/ccta3d-structure.yml'
  workflow_dispatch:

concurrency:
  group: ccta3d-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-numerics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install pytest numpy scipy pandas scikit-learn scikit-image nibabel joblib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run structural branch and historical numerical regression
        run: |
          python -m pytest -q \
            tests/test_ccta3d_structure_bridge.py \
            tests/test_azconv3d.py \
            tests/test_ccta3d_candidate_encoder.py \
            tests/test_ccta_3d_an_patches.py \
            tests/test_ccta3d_structure_oof.py \
            tests/test_ccta3d_synthetic_topology.py \
            tests/test_ccta3d_connected_branch_oracle.py \
            tests/test_ct28_branch_identity_audit.py \
            tests/test_ct28_close_tip_readout.py \
            tests/test_ct28_structure_seed_summary.py \
            tests/test_ct28_neural_calibration.py \
            tests/test_ccta_3d_an_patch_cache.py \
            tests/test_ccta_3d_an_oof.py \
            tests/test_ccta_3d_an_study.py \
            tests/test_ccta_3d_an_runtime.py \
            tests/test_ccta_3d_k10.py \
            tests/test_ccta_3d_cli.py \
            tests/test_ccta_3d_an_relation.py \
            tests/test_ccta_3d_val_an_compare.py
      - name: Verify frozen CT28 3D endpoint peak recovery
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/audit_structure_peak_recovery.py \
            --out evidence/ccta3d_structure_peaks/audit.json --frame-mode fixed_lps
      - name: Validate true CT28 PAIR/JUNCTION close-tip readout errors
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/audit_ct28_close_tip_readout.py \
            --out evidence/ccta3d_structure_peaks/true_candidate_subvoxel.json
      - name: Test same-connected-tree false branch oracle, no clinical CT
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/audit_connected_branch_oracle.py \
            --n 8 --out evidence/ccta3d_structure_peaks/same_tree_branch_oracle.json
      - name: Archive peak-recovery QA
        uses: actions/upload-artifact@v4
        with:
          name: ct28-structure-peak-recovery
          path: evidence/ccta3d_structure_peaks/
          retention-days: 21
          if-no-files-found: error
      - name: Verify imports
        run: |
          python -m py_compile \
            models/azconv3d.py \
            models/structural_bridge3d.py \
            models/ccta3d_candidate_encoder.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_oof.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_patch_cache.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_structure_targets.py \
            scripts/research/ccta_graph_lira_safe_repair/audit_ct28_anatomical_segments.py \
            scripts/research/ccta_graph_lira_safe_repair/audit_ct28_close_tip_readout.py \
            scripts/research/ccta_graph_lira_safe_repair/audit_connected_branch_oracle.py \
            scripts/research/ccta_graph_lira_safe_repair/summarize_ct28_structure_seeds.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_neural_calibration.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_study.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_relation_augmented.py
