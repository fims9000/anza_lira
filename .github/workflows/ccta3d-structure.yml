name: CCTA 3D structure-aware ANZA vs CNN

on:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
  workflow_dispatch:

jobs:
  structural-numerics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          python -m pip install pytest numpy scipy pandas scikit-learn nibabel joblib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run structural branch and historical numerical regression
        run: |
          python -m pytest -q \
            tests/test_ccta3d_structure_bridge.py \
            tests/test_azconv3d.py \
            tests/test_ccta3d_candidate_encoder.py \
            tests/test_ccta_3d_an_patches.py \
            tests/test_ccta3d_structure_oof.py \
            tests/test_ccta_3d_an_oof.py \
            tests/test_ccta_3d_an_study.py \
            tests/test_ccta_3d_an_runtime.py \
            tests/test_ccta_3d_an_relation.py \
            tests/test_ccta_3d_val_an_compare.py
      - name: Verify imports
        run: |
          python -m py_compile \
            models/azconv3d.py \
            models/structural_bridge3d.py \
            models/ccta3d_candidate_encoder.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_oof.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_patch_cache.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_structure_targets.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_study.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_relation_augmented.py
