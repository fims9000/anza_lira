name: S56 global 2-D paths (machine-only, no private data)
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s56_*.py'
      - 'scripts/research/bubble_chamber/s56_*.py'
      - 'scripts/research/bubble_chamber/s57_*.py'
      - 'bubble_chamber/s58_*.py'
      - 'scripts/research/bubble_chamber/s58_*.py'
      - 'tests/test_s56_*.py'
      - 'tests/test_s57_*.py'
      - 'tests/test_s58_*.py'
      - '.github/workflows/s56_global_path_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine_only_source_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only research test dependencies
        run: python -m pip install numpy scipy scikit-learn networkx opencv-python-headless pytest torch
      - name: Verify endpoint constraints, abstention, frozen splits and offline viewer
        run: python -m pytest -q tests/test_s56_global_paths.py tests/test_s56_benchmark_protocol.py tests/test_s57_private_viewer_safety.py tests/test_s58_path_components.py
      - name: Compile S56-S57 source without private data
        run: python -m compileall -q bubble_chamber/s56_global_path_assembly.py bubble_chamber/s56_three_piece_scenes.py scripts/research/bubble_chamber/s56_benchmark_global_paths.py scripts/research/bubble_chamber/s57_build_global_paths_viewer.py bubble_chamber/s58_assemble_path_hypotheses.py scripts/research/bubble_chamber/s58_export_native_path_hypotheses.py scripts/research/bubble_chamber/s58_package_private_paths.py
