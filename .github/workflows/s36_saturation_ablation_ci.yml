name: S36 source-locked AZConv saturation ablation contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s36_*.py'
      - 'scripts/research/bubble_chamber/s36_*.py'
      - 'tests/test_s36_*.py'
      - '.github/workflows/s36_saturation_ablation_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s36_source-only_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn scikit-image opencv-python-headless pytest torch matplotlib
      - name: Verify original models unchanged
        run: python -c 'from scripts.research.bubble_chamber.s14_train_sparse_anza import verify_model_source; verify_model_source()'
      - name: Test image normalization, strict model provenance and S35 regressions
        run: python -m pytest -q tests/test_s36_saturation_source_lock.py tests/test_s35_photometric_consistency.py tests/test_s33_photometric_domain.py
      - name: Compile source-only modules
        run: |
          python -m py_compile bubble_chamber/s36_saturation_normalization.py \
            scripts/research/bubble_chamber/s36_train_saturation.py \
            scripts/research/bubble_chamber/s36_eval_saturation.py \
            scripts/research/bubble_chamber/s36_posthoc_component_audit.py \
            scripts/research/bubble_chamber/s36_collect_report.py
