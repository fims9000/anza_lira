name: S96 conservative junction alternatives and blinded human pair review
on:
  push:
    branches:
      - feature/bubble-s96-junction-alternatives-2026-11-06
    paths:
      - 'bubble_chamber/s96_*.py'
      - 'scripts/research/bubble_chamber/physicists_s96_*.py'
      - 'tests/test_s96_*.py'
      - '.github/workflows/s96_junction_review_ci.yml'
      - 'docs/bubble_chamber/S96_*.md'
  pull_request:
    branches:
      - feature/bubble-s95-all-object-typing-operator-curves-2026-11-06
    paths:
      - 'bubble_chamber/s96_*.py'
      - 'scripts/research/bubble_chamber/physicists_s96_*.py'
      - 'tests/test_s96_*.py'
      - '.github/workflows/s96_junction_review_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-geometry-and-human-annotation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight synthetic research dependencies
        run: python -m pip install numpy scipy scikit-image opencv-python-headless==4.13.0.92 networkx scikit-learn pytest
      - name: S96 geometry and source-pixel full workflow plus prior S95 contracts
        run: >-
          python -m pytest -q
          tests/test_s96_junction_graph.py
          tests/test_s96_junction_workflow.py
          tests/test_s96_mask_junction_arms.py
          tests/test_s95_gap_visual_review.py
          tests/test_s95_all_structure_review.py
          tests/test_s95_human_review.py
      - name: Parse and import both CLI actions
        run: |
          python -m compileall -q bubble_chamber/s96_junction_graph.py bubble_chamber/s96_mask_junction_arms.py bubble_chamber/s96_junction_human_review.py bubble_chamber/s96_junction_workflow.py scripts/research/bubble_chamber/physicists_s96_junctions.py
          python scripts/research/bubble_chamber/physicists_s96_junctions.py --help >/dev/null
          python scripts/research/bubble_chamber/physicists_s96_junctions.py run --help >/dev/null
          python scripts/research/bubble_chamber/physicists_s96_junctions.py compile --help >/dev/null
      - name: No private originals, expert reviews, coordinates or weights added
        run: |
          if git ls-files bubble_chamber/s96* tests/test_s96* docs/bubble_chamber/S96* | grep -Ei '\.(bmp|png|jpg|jpeg|pt|pth|npy|npz|zip|7z|json)$'; then
            echo 'S96 source-only branch cannot publish private physical imagery, labels or trained weights' >&2
            exit 1
          fi
