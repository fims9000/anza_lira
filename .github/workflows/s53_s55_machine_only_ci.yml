name: S53-S55 machine-only source/provenance guards
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s53_*.py'
      - 'bubble_chamber/s54_*.py'
      - 'scripts/research/bubble_chamber/s5[3-5]_*.py'
      - 'scripts/research/bubble_chamber/s55_*.html'
      - 'tests/test_s5[3-5]_*.py'
      - '.github/workflows/s53_s55_machine_only_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine_only_provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only dependencies (no private dataset or model weights)
        run: python -m pip install numpy scipy scikit-learn scikit-image opencv-python-headless pillow pytest
      - name: Test paired-renderer protocol, strict source folds, OOD unknown semantics and no auto-joins
        run: >-
          python -m pytest -q
          tests/test_s53_bead_texture.py
          tests/test_s54_context_ood.py
          tests/test_s55_native_shape_simulator.py
          tests/test_s55_private_demo_safety.py
      - name: Verify compilable source-only modules
        run: python -m compileall -q bubble_chamber/s53_*.py bubble_chamber/s54_*.py scripts/research/bubble_chamber/s53_*.py scripts/research/bubble_chamber/s54_*.py scripts/research/bubble_chamber/s55_*.py
