name: Train available synthetic 3D JUNCTION - CNN vs ANZA
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
    paths:
      - '.github/workflows/ccta3d-pretrain-synthetic-junction.yml'
concurrency:
  group: synthetic-junction-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  train:
    name: junction (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: full_ct
            seeds: '17 41 73'
            control: ''
          - config: endpoints_only
            seeds: '17'
            control: '--endpoints-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controlled CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.4' 'scipy==1.16.3' 'scikit-learn==1.7.2' 'pytest==8.4.2'
          python -m pip install 'torch==2.9.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify generated JUNCTION topology and weight contract
        run: |
          python -m pytest -q tests/test_synthetic_junction_training.py
      - name: Train and independently test three-arm CCTA-like phantoms
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/benchmark_synthetic_junction_training.py \
            --out "evidence/pretrained_junction_${{ matrix.config }}/report.json" \
            --train-samples 64 --val-samples 32 --test-samples 64 \
            --side 16 --epochs 8 --seeds ${{ matrix.seeds }} \
            --models conv3d_sep_structure anza3d_sep_structure anza3d_contrast_sep_structure \
            --save-checkpoints --device cpu ${{ matrix.control }}
      - name: Validate trained .pt, independent test, and SHA-256
        env:
          CONTROL: ${{ matrix.config }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,torch
          root=pathlib.Path("evidence")/("pretrained_junction_"+os.environ["CONTROL"])
          r=json.loads((root/"report.json").read_text())
          assert r["status"]=="synthetic_only_JUNCTION_pretraining_no_CT28"
          assert r["clinical_data_accessed"] is False
          assert (r["n_train"],r["n_validation"],r["n_independent_test"])==(64,32,64)
          assert len(r["measurements"])==3*len(r["training_seeds"])
          for row in r["measurements"]:
              meta=row["checkpoint"]
              p=root/"checkpoints"/meta["filename"]
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==meta["sha256"]
              assert meta["verified_reload"]
              assert row["independent_test"]["n_examples"]==64
              assert row["independent_test"]["paired_correct"] is None
              state=torch.load(p,weights_only=True,map_location="cpu")
              assert state
          (root/"provenance.json").write_text(json.dumps({
              "git_sha":os.environ["GITHUB_SHA"],
              "experiment":os.environ["CONTROL"],
              "torch_version":torch.__version__,
              "trained_on":"procedurally generated JUNCTION 3D phantoms, NOT ImageCAS",
              "medical_validation":False,
          },indent=2)+"\n")
          print(json.dumps(r["models"],indent=2))
          PY
      - name: Preserve trained 3D JUNCTION weights and protocol
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-synthetic-junction-${{ matrix.config }}-${{ github.sha }}
          path: evidence/pretrained_junction_${{ matrix.config }}/
          retention-days: 90
          if-no-files-found: error
