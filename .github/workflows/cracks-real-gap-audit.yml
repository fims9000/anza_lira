name: CRACKS real-data controlled gap audit

on:
  push:
    branches:
      - research/cracks-real-e2e-2026-11-11
    paths:
      - 'scripts/download_cracks_v2_public.py'
      - 'scripts/cracks_real_oracle_gap_audit.py'
      - 'scripts/cracks_real_neighbor_path_v17.py'
      - 'scripts/cracks_real_long_gap_v18.py'
      - 'tests/test_cracks_real_long_gap_v18.py'
      - 'docs/research/tver2026/V18_REAL_CURVED_GAPS_FROZEN_PROTOCOL_20261112.md'
      - 'tests/test_cracks_real_neighbor_v17.py'
      - 'scripts/inspect_cracks_expert_masks.py'
      - 'tests/test_cracks_real_oracle_gap_audit.py'
      - '.github/workflows/cracks-real-gap-audit.yml'
      - 'docs/research/tver2026/CRACKS_REAL_E2E_EXECUTION.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  real-cracks-data:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and morphology dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image
      - name: Run deterministic gap extraction tests
        run: python -m unittest -v tests.test_cracks_real_oracle_gap_audit
      - name: Test real-neighbor scorer on synthetic archives
        run: python -m unittest -v tests.test_cracks_real_neighbor_v17
      - name: Test pre-registered V18 long-gap scorer
        run: python -m unittest -v tests.test_cracks_real_long_gap_v18
      - name: Cache verified public CRACKS archives
        uses: actions/cache@v4
        with:
          path: data/cracks/raw
          key: cracks-v2-6557236191763af7bd8298ecb136d41e-01e1697e886da2079ff3c1967334a7ca
      - name: Download official CRACKS v2 archives and verify published MD5
        run: python scripts/download_cracks_v2_public.py --output data/cracks/raw --receipt results/cracks_real_controlled_v1/download_receipt.json
      - name: Measure real expert mask topology
        run: python scripts/inspect_cracks_expert_masks.py
      - name: Audit expert-line masked gaps on real F3 seismic sections
        run: python scripts/cracks_real_oracle_gap_audit.py --images data/cracks/raw/images.zip --annotations "data/cracks/raw/Fault segmentations.zip" --out results/cracks_real_controlled_v1/oracle_mask_audit.json
      - name: Compare genuine adjacent-section gradients with central and shuffled controls (V17)
        run: python -m scripts.cracks_real_neighbor_path_v17 --images data/cracks/raw/images.zip --annotations "data/cracks/raw/Fault segmentations.zip" --out results/cracks_real_controlled_v1/neighbor_v17.json --cases results/cracks_real_controlled_v1/neighbor_v17_cases.csv
      - name: V18 longer real expert-line gaps with straight/Hermite and genuine-neighbor controls
        run: python -m scripts.cracks_real_long_gap_v18 --images data/cracks/raw/images.zip --annotations "data/cracks/raw/Fault segmentations.zip" --out results/cracks_real_controlled_v1/longgap_v18.json --cases results/cracks_real_controlled_v1/longgap_v18_cases.csv
      - name: Freeze model availability and scientific claim boundary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths={
            "frozen_anza_checkpoint":list(Path("results").rglob("checkpoint-last.pt")),
            "historical_lira_checkpoint":list(Path("results").rglob("pair_classifier/checkpoint.pt")),
          }
          report={
            "status":"MODEL_E2E_NOT_EXECUTED_WITHOUT_VERIFIED_CHECKPOINTS",
            "frozen_checkpoints_present":{k:bool(v) for k,v in paths.items()},
            "oracle_mask_diagnostic_is_full_e2e":False,
            "real_CRACKS_model_accuracy_claimed":False,
          }
          out=Path("results/cracks_real_controlled_v1/model_e2e_status.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2)+"\n")
          print(report)
          PY
      - name: Upload receipts and real-data audit (not raw images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cracks-real-gap-audit
          path: |
            results/cracks_real_controlled_v1/*.json
            results/cracks_real_controlled_v1/*.csv
          if-no-files-found: warn
      - name: Publish genuine CRACKS V17 evidence to research PR
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/cracks_v17_result.md
          import json, os
          from pathlib import Path
          r=json.loads(Path('results/cracks_real_controlled_v1/neighbor_v17.json').read_text())
          print('### V17: genuine CRACKS adjacent-section audit (executed)')
          print('Run: https://github.com/fims9000/anza_lira/actions/runs/'+os.getenv('GITHUB_RUN_ID',''))
          print('Commit: '+os.getenv('GITHUB_SHA',''))
          print()
          print('Uses real consecutive F3 seismic images, oracle-selected masked expert line, known visible endpoints and five fixed candidate curves. NOT ANZA/LIRA E2E; no valid false-bridge negatives; no cross-volume generalization.')
          print('Expert sections:',r['N_expert_sections'],'gaps:',r['N_gaps'])
          print('Near/far seismic image correlation:',round(r['alignment']['mean_near_corr'],4),'/',round(r['alignment']['mean_far_corr'],4))
          print('| Split | Method | N | Mean distance (px) | Precision <=2 px | Oracle-best candidate rate |')
          print('|---|---|---:|---:|---:|---:|')
          for split,part in r['by_split'].items():
              for name,m in part['methods'].items():
                  print('|',split,'|',name,'|',part['N'],'|',round(m['mean_distance'],4),'|',round(m['mean_precision_tol2'],4),'|',round(m['oracle_best_choice_rate'],4),'|')
          print('Exploratory: spatial blocks reused after initial pilot. Per-case CSV in workflow artifact; SHA256 '+r['cases_csv_sha256'])
          PY
          gh issue comment 25 --repo fims9000/anza_lira --body-file /tmp/cracks_v17_result.md
      - name: Report V17 workflow failure with source run identifier
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 25 --repo fims9000/anza_lira --body "CRACKS V17 research CI failed before a validated real-data conclusion: https://github.com/fims9000/anza_lira/actions/runs/${GITHUB_RUN_ID}. Commit ${GITHUB_SHA}. No model accuracy claim is authorized."
