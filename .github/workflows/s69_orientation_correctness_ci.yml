name: S68-S70 pixel-only synthetic correctness and provenance
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s68_branch_preserving_instances.py'
      - 'bubble_chamber/s69_orientation_invariant_audit.py'
      - 'scripts/research/bubble_chamber/s68_benchmark_branch_preservation.py'
      - 'scripts/research/bubble_chamber/s69_replay_endpoint_audit.py'
      - 'scripts/research/bubble_chamber/s70_reaudit_s64_historic.py'
      - 'tests/test_s68_branch_instances.py'
      - 'tests/test_s68_protocol.py'
      - 'tests/test_s69_orientation_invariant_audit.py'
      - 'tests/test_s69_reaudit_protocol.py'
      - 'tests/test_s70_reaudit_protocol.py'
      - '.github/workflows/s69_orientation_correctness_ci.yml'
  workflow_dispatch:
jobs:
  correctness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source dependencies
        run: python -m pip install numpy scipy scikit-image scikit-learn opencv-python-headless networkx pytest
      - name: Install CPU-only PyTorch for historical source imports
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source-only orientation and retro-audit contracts
        run: python -m pytest -q tests/test_s68_branch_instances.py tests/test_s68_protocol.py tests/test_s69_orientation_invariant_audit.py tests/test_s69_reaudit_protocol.py tests/test_s70_reaudit_protocol.py tests/test_s64_pixel_to_path.py
      - name: Compile reproducible experiment modules
        run: python -m compileall -q bubble_chamber/s68_branch_preserving_instances.py bubble_chamber/s69_orientation_invariant_audit.py scripts/research/bubble_chamber/s68_benchmark_branch_preservation.py scripts/research/bubble_chamber/s69_replay_endpoint_audit.py scripts/research/bubble_chamber/s70_reaudit_s64_historic.py
