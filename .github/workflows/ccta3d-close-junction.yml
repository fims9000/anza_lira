name: CCTA 3D close-tip JUNCTION identity stress

on:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
    paths:
      - 'scripts/research/ccta_graph_lira_safe_repair/benchmark_structural_tubes.py'
      - 'models/structural_bridge3d.py'
      - 'models/ccta3d_candidate_encoder.py'
      - '.github/workflows/ccta3d-close-junction.yml'
  workflow_dispatch:

concurrency:
  group: ccta3d-close-junction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close_junction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        intensity: [raw, rank]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical verification environment
        run: |
          python -m pip install numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Close (<3mm) synthetic JUNCTION 7-model matched comparison
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/benchmark_structural_tubes.py \
            --out evidence/ccta3d_close_junction_${{ matrix.intensity }}/report.json \
            --train-samples 96 --val-samples 48 --epochs 12 \
            --seeds 17 41 73 --kinds JUNCTION \
            --close-junction --separate-endpoints \
            --intensity-control ${{ matrix.intensity }} --device cpu
      - name: Archive paired results and clinical-safety caveats
        uses: actions/upload-artifact@v4
        with:
          name: ccta3d-close-junction-${{ matrix.intensity }}
          path: evidence/ccta3d_close_junction_${{ matrix.intensity }}/
          if-no-files-found: error
          retention-days: 21
