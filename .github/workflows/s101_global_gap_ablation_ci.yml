name: S101 bounded global source-gap linear forest vs original greedy S92
on:
  push:
    branches:
      - feature/bubble-s101-global-gap-path-ablation-2026-11-06
    paths:
      - 'bubble_chamber/s101_*.py'
      - 'scripts/research/bubble_chamber/physicists_s101_*.py'
      - 'tests/test_s101_*.py'
      - '.github/workflows/s101_global_gap_ablation_ci.yml'
      - 'docs/bubble_chamber/S101_*.md'
  pull_request:
    branches:
      - feature/bubble-s100-unlabeled-cross-shape-review-2026-11-06
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-gap-linear-forest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-photo algorithm dependencies
        run: python -m pip install numpy scipy scikit-image opencv-python-headless==4.13.0.92 networkx scikit-learn pytest
      - name: Source S92 exact global 2D gap graph and parent regressions
        run: >-
          python -m pytest -q
          tests/test_s101_global_gap_matching.py
          tests/test_s92_curve_geometry.py
          tests/test_s98_trace_continuity.py
          tests/test_s100_cross_geometry.py
          tests/test_s99_blind_sampling_and_morphology.py
          --basetemp=$RUNNER_TEMP/s101_source_exact
      - name: Import and source-only research CLI
        run: |
          python -m compileall -q bubble_chamber/s101_global_gap_matching.py
          python -m compileall -q scripts/research/bubble_chamber/physicists_s101_global_gap_ablation.py
          python scripts/research/bubble_chamber/physicists_s101_global_gap_ablation.py --help >/dev/null
      - name: No private original H50Z or source annotations in code repository
        run: |
          if git ls-files bubble_chamber/s101* tests/test_s101* docs/bubble_chamber/S101* | grep -Ei '\.(bmp|png|jpg|jpeg|pt|pth|npy|npz|zip|7z|json)$'; then
            echo 'Original H50Z BMP and private human masks are prohibited' >&2
            exit 1
          fi
