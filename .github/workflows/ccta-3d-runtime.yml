name: CCTA 3D runtime
on:
  push:
    branches:
      - feature/ccta-3d-runtime-2026-11-02
  pull_request:
    branches:
      - audit/ct28-pretest-safety-2026-11-02
      - research/coronary-connectivity-repair
    paths:
      - 'scripts/research/ccta_graph_lira_safe_repair/ccta_3d_*'
      - 'tests/test_ccta_3d_*'
      - '.github/workflows/ccta-3d-runtime.yml'
  workflow_dispatch:

jobs:
  pure-cpu-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging and inference dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy scipy scikit-image pandas scikit-learn joblib nibabel pytest
      - name: Verify Python 3D pipeline and NIfTI CLI
        run: |
          python -m pytest -q \
            tests/test_ccta_3d_endpoints.py \
            tests/test_ccta_3d_global.py \
            tests/test_ccta_3d_k10.py \
            tests/test_ccta_3d_runtime.py \
            tests/test_ccta_3d_cli.py \
            tests/test_ccta_3d_train_gap_simulator.py \
            tests/test_ccta_3d_evaluate.py \
            tests/test_ccta_3d_export_training_ct.py
      - name: Compile runtime
        run: |
          python -m compileall -q \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_endpoints.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_global.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_k10.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_runtime.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_cli.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_train_gap_simulator.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_evaluate.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_export_training_ct.py
