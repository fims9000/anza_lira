name: Bubble Chamber research source snapshot
# S32: fresh snapshot of canonical S31 code before modifications
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - '.github/workflows/s25_research_source_snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package only repository source and tests
        run: |
          mkdir -p /tmp/bubble_repo_snapshot
          cp -a bubble_chamber models scripts tests docs .github /tmp/bubble_repo_snapshot/
          cd /tmp/bubble_repo_snapshot
          tar -czf "$GITHUB_WORKSPACE/bubble_repo_snapshot.tar.gz" bubble_chamber models scripts tests docs .github
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-repository-source
          path: bubble_repo_snapshot.tar.gz
          retention-days: 2
