name: S85 original AZUNet to Graph-LIRA end-to-end source-only handoff
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/interop_anza_frontend.py'
      - 'scripts/research/bubble_chamber/example_anza_to_graph_lira.py'
      - 'tests/test_interop_anza_full_path.py'
      - 'README_FULL_ANZA_LIRA_HANDOFF.md'
      - 'docs/bubble_chamber/FULL_ANZA_LIRA_HANDOFF_2026_10_28.md'
      - '.github/workflows/s85_full_anza_lira_handoff_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-anza-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all source-only runtime and test requirements
        run: python -m pip install numpy scipy scikit-image scikit-learn opencv-python-headless networkx pytest
      - name: Install original AZUNet CPU runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Regression contracts for original ANZA and Graph-LIRA interoperability
        run: >-
          python -m pytest -q tests/test_interop_anza_full_path.py
          tests/test_s14_anza_frontend.py tests/test_anza_segmentation_adapter.py
          tests/test_interop_public_api.py tests/test_interop_verified_runtime.py
          tests/test_interop_coordinates.py
      - name: Exercise the ORIGINAL randomly initialized AZUNet architecture and graph handoff
        run: python scripts/research/bubble_chamber/example_anza_to_graph_lira.py
      - name: Source syntax and privacy controls
        shell: bash
        run: |
          python -m compileall -q bubble_chamber/interop_anza_frontend.py scripts/research/bubble_chamber/example_anza_to_graph_lira.py
          if git ls-files 'bubble_chamber/interop_anza*' 'scripts/research/bubble_chamber/example_anza*' 'docs/bubble_chamber/FULL_ANZA_LIRA*' | grep -Ei '\.(bmp|png|jpe?g|7z|zip|pt|pth|ckpt|pkl|npy|npz)$'; then
            echo 'Private images/weights must not be committed with ANZA-LIRA integration' >&2
            exit 1
          fi
