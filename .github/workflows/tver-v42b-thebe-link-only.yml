name: Tver V42b bounded real Thebe LINK-only fixed-48 source port ablation
on:
  push:
    branches:
      - research/tver-v42-port-budget-frozen-thebe-20261114
    paths:
      - 'scripts/tver_v26_predicted_cracks_e2e.py'
      - 'scripts/tver_v42b_link_only_ports.py'
      - 'tests/test_tver_v42b_link_only_ports.py'
      - '.github/workflows/tver-v42b-thebe-link-only.yml'
      - 'docs/research/tver2026/V42B_PORT_BUDGET_BOUNDED_COMPUTE_PROTOCOL_20261114.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  frozen_anza_ports_not_extra_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model and segmentation/candidate evaluation requirements
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn joblib matplotlib pytest
      - name: Test default SBPP compatibility, fixed candidate limit and no label leaks
        run: |
          python -m compileall -q scripts/tver_v26_predicted_cracks_e2e.py scripts/tver_v42b_link_only_ports.py
          python -m pytest -q tests/test_tver_v42b_link_only_ports.py tests/test_tver_v26_predicted_pipeline.py tests/test_tver_v34_anza_p0_relation_cal.py
      - name: Restore immutable real Thebe original V33 ANZA model and topology
        uses: actions/download-artifact@v4
        with:
          run-id: 43601925275
          name: tver-v33-Thebe-real-expert-TRAIN-VALID-memmap-source-verified-TEST-unopened
          github-token: ${{ github.token }}
          path: data/tver_v33_verified_frontends
      - name: Restore original V32 checked TRAIN/VAL expert fault masks, no TEST
        uses: actions/download-artifact@v4
        with:
          run-id: 43600860512
          name: tver-v32-thebe-independent-seismic-field-source-manifest-NO-DATA
          github-token: ${{ github.token }}
          path: data/thebe_v32_manifest
      - uses: actions/cache@v4
        with:
          path: data/thebe_v32_raw
          key: thebe-v34-seistrain1-534e78ab34bb0ece32ca0a9b69ee99cd-seisval1-518d2979a1f90d535ebc2a44f615970f
      - name: Check frozen ANZA SHA, original 0.65 and external TEST embargo
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.tver_v34_anza_p0_relation_cal import _state_report
          import hashlib
          base=Path('data/tver_v33_verified_frontends')
          receipt=_state_report(base)
          a=receipt['frontends']['anza_v1']
          assert a['topology_threshold_frozen']==.65
          assert hashlib.sha256((base/a['checkpoint']).read_bytes()).hexdigest()==a['SHA256']
          assert receipt['heldout_THEBE_TEST7_NOT_OPENED']
          print('V42B exact original model, source and segmentation receipt PASS')
          PY
      - name: Fetch only verified official original Thebe TRAIN and VAL amplitudes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from scripts.tver_v32_thebe_seismic_headers import fetch_streaming_checked
          m=json.loads(Path('data/thebe_v32_manifest/thebe_public_metadata_inventory.json').read_text())
          assert m['status']=='V32_THEBE_EXTERNAL_FIELD_DATAVERSE_METADATA_ONLY_COMPLETE'
          fields={x['name']:x for x in m['files']}
          root=Path('data/thebe_v32_raw')
          root.mkdir(parents=True,exist_ok=True)
          for n in ('seistrain1.npz','seisval1.npz'):
              print(n,fetch_streaming_checked(fields[n],root/n),flush=True)
          for n in ('faulttrain1.npz','faultval1.npz'):
              shutil.copyfile(Path('data/thebe_v32_manifest/label_headers')/n,root/n)
          PY
      - name: Convert original source to bounded memory memmap (TRAIN and VAL only)
        run: |
          python -m scripts.tver_v33_thebe_memmap \
            --source-dir data/thebe_v32_raw \
            --out-dir .tver_v42b/input_memmap
      - name: Compare 4 source-port allocations for 120 LINK cases only, no TRAIN/NO_LINK
        run: |
          python -m scripts.tver_v42b_link_only_ports \
            --mmap-root .tver_v42b/input_memmap \
            --frontends-dir data/tver_v33_verified_frontends \
            --out-dir .tver_v42b/result
          git rev-parse HEAD > .tver_v42b/result/V42B_CODE_SHA.txt
      - name: Upload case-level and summary receipts, no source or test arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v42b-real-Thebe-LINK-only-fixed-48-port-allocation-noTEST
          path: .tver_v42b/result
          if-no-files-found: warn
          retention-days: 90
