name: V54 full-section ANZA evidence and coverage profile (no TEST7)
on:
  push:
    branches:
      - research/tver-v54-trace-candidate-recall-20261122
    paths:
      - scripts/tver_v54_full_section_infer.py
      - scripts/tver_v54_neighbor_experiment.py
      - .github/workflows/tver-v54-full-section.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tver-v54-full-section-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  annotated_trace_coverage_real_thebe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch and numeric dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn joblib matplotlib pytest
      - name: Test trace evidence and original safe data contracts
        run: |
          python -m compileall -q scripts/tver_v54_full_section_infer.py trace_extraction/coverage.py
          python -m pytest -q tests/test_trace_coverage.py tests/test_tver_v54_full_section_infer.py tests/test_section_candidates.py
      - name: Restore immutable V33 trained Thebe ANZA
        uses: actions/download-artifact@v4
        with:
          run-id: 43601925275
          name: tver-v33-Thebe-real-expert-TRAIN-VALID-memmap-source-verified-TEST-unopened
          github-token: ${{ github.token }}
          path: data/tver_v33_verified_frontends
      - name: Restore original V32 TRAIN/VAL labels manifest
        uses: actions/download-artifact@v4
        with:
          run-id: 43600860512
          name: tver-v32-thebe-independent-seismic-field-source-manifest-NO-DATA
          github-token: ${{ github.token }}
          path: data/thebe_v32_manifest
      - uses: actions/cache@v4
        with:
          path: data/thebe_v32_raw
          key: thebe-v34-seistrain1-534e78ab34bb0ece32ca0a9b69ee99cd-seisval1-518d2979a1f90d535ebc2a44f615970f
      - name: Verify train-only normalization, ANZA checkpoint and TEST7 lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.tver_v34_anza_p0_relation_cal import _state_report
          import hashlib
          base=Path('data/tver_v33_verified_frontends')
          receipt=_state_report(base)
          model=receipt['frontends']['anza_v1']
          assert hashlib.sha256((base/model['checkpoint']).read_bytes()).hexdigest()==model['SHA256']
          assert receipt['heldout_THEBE_TEST7_NOT_OPENED']
          print('V33 weights and original normalization locked')
          PY
      - name: Fetch only official Thebe TRAIN/VAL source chunks with checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from scripts.tver_v32_thebe_seismic_headers import fetch_streaming_checked
          m=json.loads(Path('data/thebe_v32_manifest/thebe_public_metadata_inventory.json').read_text())
          assert m['status']=='V32_THEBE_EXTERNAL_FIELD_DATAVERSE_METADATA_ONLY_COMPLETE'
          src={f['name']:f for f in m['files']}
          root=Path('data/thebe_v32_raw')
          root.mkdir(parents=True,exist_ok=True)
          for n in ('seistrain1.npz','seisval1.npz'):
              print(n,fetch_streaming_checked(src[n],root/n),flush=True)
          for n in ('faulttrain1.npz','faultval1.npz'):
              shutil.copyfile(Path('data/thebe_v32_manifest/label_headers')/n,root/n)
          PY
      - name: Convert bounded-memory source arrays
        run: |
          python -m scripts.tver_v33_thebe_memmap \
            --source-dir data/thebe_v32_raw \
            --out-dir .tver_v54/full_memmap
      - name: Infer complete predeclared TRAIN/inspected CAL sections without gap oracle
        run: |
          python -m scripts.tver_v54_full_section_infer \
            --mmap-root .tver_v54/full_memmap \
            --frontends-dir data/tver_v33_verified_frontends \
            --train-sections 20 80 \
            --val-sections 43 77 \
            --tile-size 96 --stride 64 --batch-size 8 \
            --out-dir .tver_v54/full_output
          git rev-parse HEAD > .tver_v54/full_output/V54_CODE_SHA.txt
      - name: Compare center-only and neighboring-section support at fixed pixel budgets
        run: |
          python -m scripts.tver_v54_neighbor_experiment \
            --mmap-root .tver_v54/full_memmap \
            --frontends-dir data/tver_v33_verified_frontends \
            --out-dir .tver_v54/full_output/context
      - name: Upload coverage receipts, predictions and honest weak-line previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v54-real-Thebe-full-section-evidence-exploratory-noTEST
          path: .tver_v54/full_output
          if-no-files-found: warn
          retention-days: 90
