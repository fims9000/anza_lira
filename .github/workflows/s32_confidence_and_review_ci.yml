name: S32 machine review and confidence loss contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s32_*.py'
      - 'scripts/research/bubble_chamber/s32_*.py'
      - 'tests/test_s32_*.py'
      - '.github/workflows/s32_confidence_and_review_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s32-safe-machine-only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: python -m pip install numpy scipy scikit-learn scikit-image opencv-python-headless torch pytest
      - name: Verify weighted loss, unknown masks, review queue, safe graph relation compilation
        run: python -m pytest -q tests/test_s32_confidence.py tests/test_s32_queue.py tests/test_s32_relation_bridge.py tests/test_s31_contracts.py
      - name: Refuse to publish original data with code
        run: |
          test ! -e S32_MACHINE_REVIEWER.html
          test ! -e S31_MACHINE_DRAFTS.json
