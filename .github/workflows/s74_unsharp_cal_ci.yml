name: S74 frozen sharpening CAL and fresh-test contracts
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s74_*.py'
      - 'scripts/research/bubble_chamber/s74_*.py'
      - 'tests/test_s74_*.py'
      - 'docs/bubble_chamber/S74_*'
      - 'docs/bubble_chamber/EXPERIMENT_IDS_MACHINE_ONLY.json'
      - '.github/workflows/s74_unsharp_cal_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_only_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy scikit-image scikit-learn opencv-python-headless networkx pytest
      - name: Install torch CPU for frozen source module imports
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original corrected evaluator, frozen CAL gate, TEST and source-only provenance
        run: python -m pytest -q tests/test_s69_orientation_invariant_audit.py tests/test_s72_public_aggregate.py tests/test_s73_public_frozen_results.py tests/test_s74_unsharp.py tests/test_s74_phase_protocol.py tests/test_s74_public_results.py
      - name: Compile research module and benchmark
        run: python -m compileall -q bubble_chamber/s74_unsharp_preprocess.py scripts/research/bubble_chamber/s74_calibrate_then_test_unsharp.py
