name: CCTA 3D ANZA research primitive
on:
  push:
    branches:
      - feature/ccta-3d-anza-encoder-2026-11-02
      - feature/ccta3d-research-contract-2026-11-02
      - feature/ccta3d-ct-signal-2026-11-03
      - feature/ct28-relation-matched-ablation-2026-11-03
      - feature/ccta3d-local-experiment-handoff-2026-11-03
  pull_request:
    branches:
      - feature/ccta-3d-runtime-2026-11-02
      - feature/ccta-3d-anza-encoder-2026-11-02
    paths:
      - 'models/azconv3d.py'
      - 'models/ccta3d_candidate_encoder.py'
      - 'scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_*'
      - 'tests/test_azconv3d.py'
      - 'tests/test_ccta3d_candidate_encoder.py'
      - 'tests/test_ccta_3d_an_*'
      - '.github/workflows/ccta-3d-anza.yml'
  workflow_dispatch:

jobs:
  azconv3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and test suite
        run: |
          python -m pip install pytest numpy scipy scikit-image pandas scikit-learn joblib nibabel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify volumetric fuzzy anisotropy and gradients
        run: |
          python -m pytest -q \
            tests/test_azconv3d.py \
            tests/test_ccta3d_candidate_encoder.py \
            tests/test_ccta_3d_an_patches.py \
            tests/test_ccta_3d_an_patch_cache.py \
            tests/test_ccta_3d_an_train.py \
            tests/test_ccta_3d_an_oof.py \
            tests/test_ccta_3d_an_relation.py \
            tests/test_ccta_3d_an_runtime.py \
            tests/test_ccta_3d_an_study.py \
            tests/test_ccta_3d_an_real_scene_contract.py \
            tests/test_ct28_cardinality_benchmark.py \
            tests/test_ct28_topology_metrics.py \
            tests/test_ct28_mask_eval_tight_roi.py \
            tests/test_ccta_3d_an_controls.py \
            tests/test_ccta_3d_failure_triage.py \
            tests/test_ccta_3d_validation_gap.py \
            tests/test_ccta_3d_val_freeze.py \
            tests/test_ccta_3d_val_cohort.py \
            tests/test_ccta_3d_val_an_compare.py \
            tests/test_ct28_saved_ct_signal.py \
            tests/test_ct28_saved_pair_ct_signal.py \
            tests/test_ccta_3d_an_preflight.py \
            tests/test_ccta_3d_an_scene_rank.py
      - name: Compile 3D kernel and train-only workflow
        run: |
          python -m py_compile \
            models/azconv3d.py \
            models/ccta3d_candidate_encoder.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_patches.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_patch_cache.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_train.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_oof.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_relation.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_runtime.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_cli.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_study.py \
            scripts/research/ccta_graph_lira_safe_repair/ct28_cardinality_benchmark.py \
            scripts/research/ccta_graph_lira_safe_repair/ct28_topology_metrics.py \
            scripts/research/ccta_graph_lira_safe_repair/ct28_mask_metrics.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_controls.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_failure_triage.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_export.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_freeze.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_pilot.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_cohort.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_an_compare.py \
            scripts/research/ccta_graph_lira_safe_repair/ct28_saved_ct_signal.py \
            scripts/research/ccta_graph_lira_safe_repair/ct28_saved_pair_ct_signal.py \
            scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_preflight.py
      - name: Verify Linux CLI imports without medical CT
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_patch_cache.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_train.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_oof.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_relation.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_cli.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_study.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ct28_cardinality_benchmark.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_controls.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_failure_triage.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_export.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_freeze.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_pilot.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_cohort.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_val_an_compare.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ct28_saved_ct_signal.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ct28_saved_pair_ct_signal.py --help >/dev/null
          python scripts/research/ccta_graph_lira_safe_repair/ccta_3d_an_preflight.py --help >/dev/null
