name: Bubble S7 original-model smoke
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - scripts/research/bubble_chamber/s7_original_retrain.py
      - tests/test_s7_original_retrain.py
      - .github/workflows/s7_bubble_original_smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch code (original models unmodified)
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install torch numpy opencv-python-headless scipy scikit-image pytest
      - name: Unit contracts
        run: python -m pytest -q tests/test_s7_original_retrain.py tests/test_bubble_neural_metrics.py
      - name: Train exact-source models on controlled procedural smoke
        run: |
          python scripts/research/bubble_chamber/s7_original_retrain.py \
            --source procedural --out-dir results/bubble_chamber/s7_ci \
            --size 32 --epochs 1 --batch-size 2 --train-limit 8 \
            --val-limit 4 --test-limit 6 --widths 4 4 4 4 --rules 2 \
            --steps-per-epoch 2 --cpu-threads 2
      - name: Verify resume from original weights and optimizer state
        run: |
          python scripts/research/bubble_chamber/s7_original_retrain.py \
            --source procedural --out-dir results/bubble_chamber/s7_ci \
            --size 32 --epochs 2 --batch-size 2 --train-limit 8 \
            --val-limit 4 --test-limit 6 --widths 4 4 4 4 --rules 2 \
            --steps-per-epoch 2 --cpu-threads 2 --resume
      - name: Publish metrics and resumable checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-original-azconv-cpu-smoke
          path: |
            results/bubble_chamber/s7_ci/
            models/azconv.py
            models/segmentation.py
          if-no-files-found: warn
          retention-days: 14
