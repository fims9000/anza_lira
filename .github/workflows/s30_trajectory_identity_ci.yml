name: S30 trajectory identity gate tests
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s30_trajectory_identity.py'
      - 'scripts/research/bubble_chamber/s30_fork_gate_demo.py'
      - 'tests/test_s30_trajectory_identity.py'
      - 'tests/test_s30_verify_dataset_archive.py'
      - 'scripts/research/bubble_chamber/s30_verify_dataset_archive.py'
      - 'docs/bubble_chamber/s30_dataset_integrity.json'
      - '.github/workflows/s30_trajectory_identity_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s30-safe-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy pytest opencv-python-headless scikit-image
      - name: Assert S30 gate never authorizes physical link
        run: python -m pytest -q tests/test_s30_trajectory_identity.py tests/test_s30_verify_dataset_archive.py
