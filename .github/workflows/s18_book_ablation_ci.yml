name: S18 Belyaev prior ablation unit contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'scripts/research/bubble_chamber/s18_*.py'
      - 'tests/test_s18_*.py'
      - '.github/workflows/s18_book_ablation_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-original-model-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU scientific dependencies
        run: |
          python -m pip install torch numpy scipy opencv-python-headless scikit-image scikit-learn matplotlib pytest
      - name: Verify S18 sparse-label isolation, physical priors and original-source training smoke
        run: python -m pytest -q tests/test_s18_*.py
      - name: Repository test boundary
        run: |
          echo 'The PRIVATE 1mH2Data and H50Z source archives are not in GitHub.'
          echo 'This job does NOT reproduce the full 30-model measured-geometry result.'
