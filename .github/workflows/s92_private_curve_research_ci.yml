name: S92 private bubble chamber curve/gap/spiral evidence
on:
  push:
    branches:
      - feature/bubble-s92-curves-gaps-spirals-2026-11-05
    paths:
      - 'bubble_chamber/s92_*.py'
      - 'scripts/research/bubble_chamber/physicists_s92_*.py'
      - 'tests/test_s92_*.py'
      - '.github/workflows/s92_private_curve_research_ci.yml'
      - 'docs/bubble_chamber/S92_*.md'
  pull_request:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s92_*.py'
      - 'scripts/research/bubble_chamber/physicists_s92_*.py'
      - 'tests/test_s92_*.py'
      - '.github/workflows/s92_private_curve_research_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s92-geometry-and-private-photo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only dependencies; no private H50Z or model weights
        run: python -m pip install numpy scipy scikit-image opencv-python-headless==4.13.0.92 networkx scikit-learn pytest
      - name: Original S86/S87 regression plus S92 adversarial geometry and native-coordinate gallery
        run: >-
          python -m pytest -q
          tests/test_s92_curve_geometry.py
          tests/test_s92_private_whole_bmp.py
          tests/test_s87_seam_continuity.py
          tests/test_full_bmp_segmentation.py
      - name: Linux CLI smoke; import and static syntax
        run: |
          python scripts/research/bubble_chamber/physicists_s92_curve_review.py --help >/dev/null
          python -m compileall -q bubble_chamber/s92_curve_geometry.py bubble_chamber/s92_curve_review.py scripts/research/bubble_chamber/physicists_s92_curve_review.py
      - name: Reject medical or bubble-chamber private images and weights in PR changes
        run: |
          if git ls-files bubble_chamber/s92* tests/test_s92* docs/bubble_chamber/S92* | grep -Ei '\.(bmp|png|jpg|jpeg|pt|pth|ckpt|npy|npz|zip|7z)$'; then
            echo 'Private evidence/images/weights cannot be committed' >&2
            exit 1
          fi
