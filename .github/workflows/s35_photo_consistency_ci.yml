name: S35 source-locked AZConv photometric consistency contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s35_*.py'
      - 'scripts/research/bubble_chamber/s35_*.py'
      - 'tests/test_s35_*.py'
      - '.github/workflows/s35_photo_consistency_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predeclared-controls-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only regression dependencies
        run: python -m pip install numpy scipy scikit-learn scikit-image opencv-python-headless pytest matplotlib torch
      - name: Verify original AZConv source blobs and security contracts
        run: |
          python -c 'from scripts.research.bubble_chamber.s14_train_sparse_anza import verify_model_source; verify_model_source()'
          python -m pytest -q tests/test_s35_photometric_consistency.py tests/test_s33_photometric_domain.py tests/test_s34_axis_source_lock.py
      - name: Compile S35 source-only modules
        run: |
          python -m py_compile bubble_chamber/s35_photometric_consistency.py \
            scripts/research/bubble_chamber/s35_train_consistency.py \
            scripts/research/bubble_chamber/s35_eval_consistency.py \
            scripts/research/bubble_chamber/s35_photo_invariance_audit.py \
            scripts/research/bubble_chamber/s35_collect_report.py
