name: Bubble S10 fixed-data source and unit contracts

on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'scripts/research/bubble_chamber/s7_original_retrain.py'
      - 'scripts/research/bubble_chamber/s9_frangi_baseline.py'
      - 'scripts/research/bubble_chamber/s10_*.py'
      - 'tests/test_s10_*.py'
      - '.github/workflows/s10_fixed_split_ci.yml'
  workflow_dispatch:

jobs:
  s10-fixed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy scipy scikit-image opencv-python-headless pytest scikit-learn
      - name: Validate fixed-source and topology contracts
        run: |
          python -m pytest -q tests/test_s10_fixed_data.py tests/test_s10_collector.py tests/test_s7_original_retrain.py tests/test_bubble_neural_metrics.py
      - name: Source-locked independent-seed procedural smoke
        run: |
          python scripts/research/bubble_chamber/s7_original_retrain.py --source procedural --out-dir /tmp/s10-procedural --seed 13 --data-seed 20261024 --size 32 --epochs 1 --batch-size 2 --train-limit 4 --val-limit 3 --test-limit 3 --widths 4 4 4 4 --rules 2 --cpu-threads 2 --az-residual --robust-train
          test -f /tmp/s10-procedural/s10_test_frame_counts.json
