name: Tver V23 hard counterfactual 2.5D synthetic link and NO_LINK
on:
  push:
    branches:
      - research/tver-v23-paired-3d-counterfactual-2026-11-14
    paths:
      - 'scripts/tver_v23_25d_counterfactual_synthetic.py'
      - 'tests/test_tver_v23_counterfactual_25d.py'
      - 'docs/research/tver2026/V23_25D_COUNTERFACTUAL_SYNTHETIC_FROZEN_PROTOCOL_20261114.md'
      - '.github/workflows/tver-v23-counterfactual-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: 'Agg'

jobs:
  three-worlds-geometry-identical-25d:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install basic CPU scientific dependencies for fair observed-only benchmark
        run: |
          python -m pip install --disable-pip-version-check numpy scipy scikit-learn pytest
      - name: Verify source geometry, exact 2D identity, strict risk CAL and grouped bootstrap
        run: |
          python -m compileall -q scripts/tver_v23_25d_counterfactual_synthetic.py
          python -m pytest -q tests/test_tver_v23_counterfactual_25d.py
      - name: Execute V23 TRAIN and CAL freeze, only then open independent IID and OOD TEST
        run: |
          python -m scripts.tver_v23_25d_counterfactual_synthetic \
            --out results/tver_v23_25d
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('results/tver_v23_25d')
          j=json.loads((root/'v23_results.json').read_text())
          lock=(root/'v23_train_cal_frozen.json').read_bytes()
          assert j['status']=='V23_SYNTHETIC_EXECUTED_AUDITED'
          assert hashlib.sha256(lock).hexdigest()==j['train_cal_frozen_SHA256']
          assert j['train_cal_frozen_before_test_opened']
          assert not j['not_trained_historical_ANZA_LIRA'] is False
          for split in ('test','ood'):
              x=j['report'][split]
              assert x['base_group_pair_audit']['bitwise_identical_central_pixels']
              assert x['base_group_pair_audit']['independent_base_groups']==160
              for baseline in ('central','geometry','learned_2d'):
                  assert abs(x['policy_results'][baseline]['all_3way_accuracy']-1/3)<1e-12
              for p in x['policy_results'].values():
                  assert p['positive']==320 and p['NOLINK']==160
                  assert p['correct_accepted']+p['wrong_branch_accepted']<=320
          PY
      - name: Preserve exact experiment code SHA
        if: always()
        run: |
          mkdir -p results/tver_v23_25d
          git rev-parse HEAD > results/tver_v23_25d/COMMIT_SHA.txt
      - name: Upload complete synthetic case scores, frozen CAL and per-group inference audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v23-25d-counterfactual-synthetic-case-audit
          path: |
            results/tver_v23_25d/v23_train_cal_frozen.json
            results/tver_v23_25d/v23_results.json
            results/tver_v23_25d/v23_test_case_scores.csv
            results/tver_v23_25d/COMMIT_SHA.txt
          if-no-files-found: warn
          retention-days: 90
