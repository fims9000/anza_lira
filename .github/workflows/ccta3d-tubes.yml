name: Diagnostic 3D tube connectivity training (not ImageCAS)

on:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
    paths:
      - 'scripts/research/ccta_graph_lira_safe_repair/benchmark_structural_tubes.py'
      - 'models/azconv3d.py'
      - 'models/structural_bridge3d.py'
      - 'models/ccta3d_candidate_encoder.py'
      - '.github/workflows/ccta3d-tubes.yml'
  workflow_dispatch:

jobs:
  paired-tube-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical benchmark dependencies
        run: |
          python -m pip install numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze synthetic training and validation protocol; compare four variants
        run: |
          python scripts/research/ccta_graph_lira_safe_repair/benchmark_structural_tubes.py \
            --out evidence/ccta3d_tube_benchmark/report.json \
            --train-samples 96 --val-samples 48 \
            --epochs 8 --seeds 17 41 --kinds PAIR JUNCTION \
            --device cpu
      - name: Publish per-seed metrics without claiming medical superiority
        uses: actions/upload-artifact@v4
        with:
          name: ccta3d-structural-tube-benchmark
          path: evidence/ccta3d_tube_benchmark/
          if-no-files-found: error
          retention-days: 21
