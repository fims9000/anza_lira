name: S20 unlabeled H50Z pretraining and human-only review contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s20_*.py'
      - 'scripts/research/bubble_chamber/s20_*.py'
      - 'scripts/research/bubble_chamber/s14_train_sparse_anza.py'
      - 'scripts/research/bubble_chamber/s19_run_small_label_pipeline.py'
      - 'tests/test_s20_*.py'
      - '.github/workflows/s20_unlabeled_and_priority_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-unlabeled-and-review-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies, CPU only
        run: |
          python -m pip install torch numpy scipy scikit-image opencv-python-headless scikit-learn pytest
      - name: Verify original AZUNet, head-safe transfer, unknown labels and review provenance
        run: python -m pytest -q tests/test_s20_*.py tests/test_s19_real_review.py
      - name: No user BMPs or fake reviewed masks in Git
        run: |
          test ! -d private_bubble_photos
          test ! -e S19_H50Z_expert_reviews.json
