name: Tver V52 out-of-renderer-family synthetic stress (not geology)
on:
  push:
    branches:
      - research/tver-v52-tangent-curvature-gap-20261116
    paths:
      - 'scripts/tver_v52_ood_geometry.py'
      - 'tests/test_tver_v52_ood_geometry.py'
      - 'scripts/tver_v52_joint_path.py'
      - '.github/workflows/tver-v52-ood-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  frozen_v50_trained_model_on_two_unseen_renderer_families:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU fixed model dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn pytest
      - name: Test held-out generator and model-agnostic metrics
        run: |
          python -m compileall -q scripts/tver_v52_ood_geometry.py
          python -m pytest -q tests/test_tver_v52_ood_geometry.py tests/test_tver_v52_joint_path.py
      - name: Train original frozen V50 once and evaluate both decoders on unseen synthetic families
        run: |
          python -m scripts.tver_v52_ood_geometry --out-dir .tver_v52_ood/result
          git rev-parse HEAD > .tver_v52_ood/result/V52_OOD_CODE_SHA.txt
      - name: Preserve synthetic case rows and model receipt; never geological data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v52-ood-two-renderer-families-not-geology
          path: .tver_v52_ood/result
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90