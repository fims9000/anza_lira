name: Tver V34 original native five-conv P0 on real Thebe ANZA→predicted SBPP, section-risk CAL; TEST7 untouched

on:
  push:
    branches:
      - research/tver-v34-thebe-anza-p0-cal-20261114
    paths:
      - 'scripts/tver_v34_anza_p0_relation_cal.py'
      - 'tests/test_tver_v34_anza_p0_relation_cal.py'
      - 'docs/research/tver2026/V34_THEBE_ANZA_ONLY_P0_RELATION_CAL_FROZEN_POSTSEG_PROTOCOL_20261114.md'
      - '.github/workflows/tver-v34-thebe-anza-P0-CAL.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  new_p0_trained_on_real_ANZA_predicted_SBPP_only:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native 5-convolution P0 and source plus calibration dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn joblib matplotlib pytest
      - name: Test immutable V33 checkpoint admission, true P0 model and section risk CP exact bounds
        run: |
          python -m compileall -q scripts/tver_v34_anza_p0_relation_cal.py
          python -m pytest -q tests/test_tver_v34_anza_p0_relation_cal.py tests/test_tver_v33_thebe_relation_cal.py tests/test_tver_v30_real_p0_context.py
      - name: Restore exact original V33 trained Thebe frontends, frozen topology and SHA
        uses: actions/download-artifact@v4
        with:
          run-id: 43601925275
          name: tver-v33-Thebe-real-expert-TRAIN-VALID-memmap-source-verified-TEST-unopened
          github-token: ${{ github.token }}
          path: data/tver_v33_verified_frontends
      - name: Restore only official V32 small expert TRAIN/VAL fault masks and source file manifest
        uses: actions/download-artifact@v4
        with:
          run-id: 43600860512
          name: tver-v32-thebe-independent-seismic-field-source-manifest-NO-DATA
          github-token: ${{ github.token }}
          path: data/thebe_v32_manifest
      - uses: actions/cache@v4
        with:
          path: data/thebe_v32_raw
          key: thebe-v34-seistrain1-534e78ab34bb0ece32ca0a9b69ee99cd-seisval1-518d2979a1f90d535ebc2a44f615970f
      - name: Verify original V33 ANZA .65, maintain U-Net STOP and Thebe TEST7 embargo
        run: |
          python - <<'PY'
          from scripts.tver_v34_anza_p0_relation_cal import _state_report
          from pathlib import Path
          import hashlib
          base=Path('data/tver_v33_verified_frontends')
          report=_state_report(base)
          a=report['frontends']['anza_v1']
          p=base/a['checkpoint']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==a['SHA256']
          assert report['heldout_THEBE_TEST7_NOT_OPENED']
          print('V34 exact V33 ANZA weight and topology freeze PASS',flush=True)
          PY
      - name: Fetch only official Thebe real TRAIN and VAL seismic chunks with provider MD5, no external TEST
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from scripts.tver_v32_thebe_seismic_headers import fetch_streaming_checked
          m=json.loads(Path('data/thebe_v32_manifest/thebe_public_metadata_inventory.json').read_text())
          assert m['status']=='V32_THEBE_EXTERNAL_FIELD_DATAVERSE_METADATA_ONLY_COMPLETE'
          b={x['name']:x for x in m['files']}
          root=Path('data/thebe_v32_raw')
          root.mkdir(parents=True,exist_ok=True)
          for n in ('seistrain1.npz','seisval1.npz'):
              print(n,fetch_streaming_checked(b[n],root/n),flush=True)
          for n in ('faulttrain1.npz','faultval1.npz'):
              shutil.copyfile(Path('data/thebe_v32_manifest/label_headers')/n,root/n)
          PY
      - name: Stream original real seismic image and expert faults into bounded RAM mmap TRAIN/VALID arrays
        run: |
          python -m scripts.tver_v33_thebe_memmap \
            --source-dir data/thebe_v32_raw \
            --out-dir results/tver_v34/input_memmap
      - name: Train true P0 and matched logistic on real ANZA-predicted SBPP pairs then CAL on distinct 60 Thebe VAL sections
        run: |
          python -m scripts.tver_v34_anza_p0_relation_cal \
            --mmap-root results/tver_v34/input_memmap \
            --frontends-dir data/tver_v33_verified_frontends \
            --out-dir results/tver_v34/real_P0_CAL
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('results/tver_v34/real_P0_CAL')
          r=json.loads((root/'v34_THEBE_P0_ANZA_source_CAL_frozen.json').read_text())
          assert r['status'] in (
              'V34_THEBE_ANZA_NATIVE_P0_AND_LOGISTIC_SECTION_CAL_COMPLETE_TEST_UNOPENED',
              'V34_STOP_TRUE_PREDICTED_TRAIN_PAIR_INSUFFICIENT',
              'V34_STOP_THEBE_ANZA_RELATION_SECTION_CAL_INSUFFICIENT')
          assert r['external_test7_images_labels_model_scores_NEVER_OPENED']
          assert r['ANZA_exact_topology_threshold']==.65
          if 'TRAIN_native_P0_two_distinct_checkpoint_receipts' in r:
              for evidence in r['TRAIN_native_P0_two_distinct_checkpoint_receipts'].values():
                  p=root/'native_new_P0_weights'/evidence['checkpoint']
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==evidence['checkpoint_SHA256']
          print('FROZEN V34 SOURCE/CAL',r['status'])
          PY
      - name: Preserve original source/SHA and model/calibration receipts
        if: always()
        run: |
          mkdir -p results/tver_v34/output
          git rev-parse HEAD > results/tver_v34/output/COMMIT_SHA.txt
          if test -f results/tver_v34/input_memmap/v33_memmap_source_receipt.json; then
            cp results/tver_v34/input_memmap/v33_memmap_source_receipt.json results/tver_v34/output/
          fi
          if test -f results/tver_v34/real_P0_CAL/v34_THEBE_P0_ANZA_source_CAL_frozen.json; then
            cp results/tver_v34/real_P0_CAL/v34_THEBE_P0_ANZA_source_CAL_frozen.json results/tver_v34/output/
            cp results/tver_v34/real_P0_CAL/native_new_P0_weights/*.pt results/tver_v34/output/ 2>/dev/null || true
            cp results/tver_v34/real_P0_CAL/v34_THEBE_ANZA_P0_CAL_case_rows.csv results/tver_v34/output/ 2>/dev/null || true
          fi
      - name: Upload only compact V34 new trained P0 and section-level evidence, not real Thebe source arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v34-thebe-real-ANZA-SBPP-native-P0-RELATION-CAL-NO-TEST
          path: |
            results/tver_v34/output/COMMIT_SHA.txt
            results/tver_v34/output/v33_memmap_source_receipt.json
            results/tver_v34/output/v34_THEBE_P0_ANZA_source_CAL_frozen.json
            results/tver_v34/output/*_new_p0_seed*.pt
            results/tver_v34/output/v34_THEBE_ANZA_P0_CAL_case_rows.csv
          if-no-files-found: warn
          retention-days: 90
