name: Tver V30 genuine newly trained P0 five-conv LIRA on predicted ANZA SBPP real CRACKS

on:
  push:
    branches:
      - research/tver-v30-p0-context-real-e2e-20261114
    paths:
      - 'scripts/tver_v26_predicted_cracks_e2e.py'
      - 'scripts/tver_v30_p0_context.py'
      - 'scripts/tver_v30_real_p0_e2e.py'
      - 'tests/test_tver_v30_real_p0_context.py'
      - 'scripts/verify_tver_v30_real_p0.py'
      - 'docs/research/tver2026/V30_REAL_PREDICTED_P0_CONTEXT_FROZEN_POSTHOC_PROTOCOL_20261114.md'
      - '.github/workflows/tver-v30-p0-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  CUBLAS_WORKSPACE_CONFIG: ':4096:8'

jobs:
  genuine_original_P0_architecture_fitted_on_predicted_ports:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU Torch and real-seismic context dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn joblib pytest matplotlib
      - name: Verify native five-convolution context, no GT input, pair matching, CAL and all old engines
        run: |
          python -m compileall -q scripts/tver_v30_p0_context.py scripts/tver_v30_real_p0_e2e.py
          python -m pytest -q tests/test_tver_v30_real_p0_context.py tests/test_tver_v28_topology_calibration.py tests/test_tver_v26_predicted_pipeline.py
      - uses: actions/cache@v4
        with:
          path: data/cracks/raw
          key: cracks-v2-6557236191763af7bd8298ecb136d41e-01e1697e886da2079ff3c1967334a7ca
      - name: Reverify official CRACKS image and expert mask archive MD5
        run: |
          python scripts/download_cracks_v2_public.py \
            --output data/cracks/raw \
            --receipt results/tver_v30/download_MD5.json
      - name: Restore exact SHA-frozen original V28 real-trained AZConv/U-Net and topology artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 43596665171
          name: tver-v28-posthoc-topology-predicted-sbpp
          github-token: ${{ github.token }}
          path: data/tver_v28_frozen_reference
      - name: Verify restored immutable original V28 checkpoint SHA256
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('data/tver_v28_frozen_reference/real')
          receipt=json.loads((root/'new_train_model/v26_segmenter_frozen.json').read_text())
          top=json.loads((root/'v28_topology_TRAIN_CAL_frozen.json').read_text())
          expected={
            'unet':'908861df22265db189b4d18f53ca587634673b3c39a96c3f3752458e8516dc4b',
            'anza_v1':'14ecda83fbf327085390f1cc5665d30730e250fc4b2192f68ac1d25fa751e300',
          }
          for name,digest in expected.items():
              item=receipt['frontends'][name]
              blob=(root/'new_train_model'/item['checkpoint']).read_bytes()
              assert hashlib.sha256(blob).hexdigest()==digest
              assert item['checkpoint_SHA256']==digest
              assert top['frontends'][name]['unchanged_actual_model_SHA256']==digest
          assert {k:v['selected_threshold'] for k,v in top['frontends'].items()}=={'unet':.6,'anza_v1':.9}
          PY
      - name: Fit actual P0 two-seed context selectors on real predicted SBPP pairs
        run: |
          python -m scripts.tver_v30_real_p0_e2e \
            --images data/cracks/raw/images.zip \
            --annotations "data/cracks/raw/Fault segmentations.zip" \
            --out results/tver_v30/predicted_p0 \
            --v28-reference data/tver_v28_frozen_reference/real
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('results/tver_v30/predicted_p0')
          report=json.loads((root/'v30_results.json').read_text())
          frozen_path=root/'v30_ALL_train_cal_frozen.json'
          lock=json.loads(frozen_path.read_text())
          assert report['status']=='V30_POSTHOC_REAL_CRACKS_PREDICTED_P0_E2E_EXECUTED'
          assert hashlib.sha256(frozen_path.read_bytes()).hexdigest()==report['all_model_frozen_SHA256']
          assert lock['V30_IS_POSTHOC_after_V27_V28_TEST_inspection']
          assert lock['never_retrained_or_rethresholded_original_V28_frontends']
          assert lock['registered_V28_segmentation_thresholds']=={'unet':.6,'anza_v1':.9}
          assert report['real_TEST_sections']==[108,124]
          for frontend in ('unet','anza_v1'):
            x=lock['frontends'][frontend]
            assert x['matched_context_training']['positive_unique_predicted_train_pairs']>=8
            assert all(v['genuine_repository_five_convolution_P0']
                       for v in x['new_native_P0_architecture_checkpoints'].values())
            assert all(v['original_historical_P0_checkpoint_used'] is False
                       for v in x['new_native_P0_architecture_checkpoints'].values())
            assert len(report['methods'][frontend])==5
            assert all(v['positive_gap_count']==2 for v in report['methods'][frontend].values())
          PY
      - name: Independently verify all five real P0-context baselines and 40 heldout case decisions
        run: |
          python scripts/verify_tver_v30_real_p0.py             --dir results/tver_v30/predicted_p0
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/tver_v30/predicted_p0/verify_v30_independent.json')
          x=json.loads(p.read_text())
          assert x['status']=='V30_INDEPENDENT_NATIVE_P0_REAL_PREDICTED_CASE_AUDIT_PASS'
          assert x['all_four_new_genuine_P0_state_dict_SHA256_verified']
          assert x['all_ten_method_frontend_cases_verified']
          assert x['posthoc_108_124_previously_seen_during_V27_V28']
          PY
      - name: Persist immutable SHA, original frozen CAL, and actual new weights
        if: always()
        run: |
          mkdir -p results/tver_v30/predicted_p0
          git rev-parse HEAD > results/tver_v30/predicted_p0/COMMIT_SHA.txt
      - name: Archive research evidence and new trained P0 architecture state dicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v30-real-predicted-ANZA-SBPP-native-P0-pilot
          path: |
            results/tver_v30/download_MD5.json
            results/tver_v30/predicted_p0/v30_source_cohort.json
            results/tver_v30/predicted_p0/v30_original_V28_topology_CAL.json
            results/tver_v30/predicted_p0/v30_ALL_train_cal_frozen.json
            results/tver_v30/predicted_p0/v30_results.json
            results/tver_v30/predicted_p0/verify_v30_independent.json
            results/tver_v30/predicted_p0/v30_test_case_decisions.csv
            results/tver_v30/predicted_p0/new_LIRA_P0_checkpoints/*.pt
            results/tver_v30/predicted_p0/newly_fitted_AZConv_UNet/*.pt
            results/tver_v30/predicted_p0/newly_fitted_AZConv_UNet/*.json
            results/tver_v30/predicted_p0/COMMIT_SHA.txt
          if-no-files-found: warn
          retention-days: 90
