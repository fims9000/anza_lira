name: Train available synthetic 3D vessel trees - CNN vs ANZA
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ccta3d-topology-anisotropy-2026-11-11
    paths:
      - '.github/workflows/ccta3d-pretrain-available-data.yml'
concurrency:
  group: train-available-synthetic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  train:
    name: synthetic-pretrain (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - experiment: full_bce
            ranking_weight: '0'
            endpoint_control: ''
            seeds: '17 41 73'
          - experiment: full_paired_ranking
            ranking_weight: '.5'
            endpoint_control: ''
            seeds: '17 41 73'
          - experiment: endpoints_only_control
            ranking_weight: '0'
            endpoint_control: '--endpoints-only'
            seeds: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned reproducible CPU dependencies
        run: |
          python -m pip install 'numpy==2.3.4' 'scipy==1.16.3' 'scikit-learn==1.7.2' 'pytest==8.4.2'
          python -m pip install 'torch==2.9.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Assert synthetic fixed train and independent test contracts
        run: |
          python -m pytest -q tests/test_same_tree_identity_benchmark.py tests/test_azconv3d.py
      - name: Train 3D vessels with independent test; persist trained weights
        run: |
          mkdir -p "evidence/pretrained_${{ matrix.experiment }}"
          python scripts/research/ccta_graph_lira_safe_repair/benchmark_same_tree_identity.py \
            --out "evidence/pretrained_${{ matrix.experiment }}/report.json" \
            --train-trees 64 --val-trees 24 --test-trees 48 \
            --epochs 12 --seeds ${{ matrix.seeds }} \
            --models conv3d_sep_structure anza3d_sep_structure anza3d_contrast_sep_structure \
            --paired-ranking-weight ${{ matrix.ranking_weight }} \
            --save-checkpoints --device cpu ${{ matrix.endpoint_control }}
      - name: Verify every trained checkpoint and provenance after reloading
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,torch
          experiment=os.environ["EXPERIMENT"]
          base=pathlib.Path("evidence")/f"pretrained_{experiment}"
          report=json.loads((base/"report.json").read_text())
          assert report["test_meta"]["held_out_CT28_test_accessed"] is False
          assert report["test_meta"]["n_independent_trees"]==48
          assert report["independent_test_summary"]["status"]=="synthetic_only_not_clinical"
          assert report["model_checkpoints_saved"] is True
          assert len(report["measurements"])==3*len(report["seeds"])
          for row in report["measurements"]:
              checkpoint=row["checkpoint"]
              path=base/"checkpoints"/checkpoint["filename"]
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==checkpoint["sha256"]
              assert row["independent_test"]["n_trees"]==48
              assert checkpoint["verified_reload"] is True
              state=torch.load(path,weights_only=True,map_location="cpu")
              assert state
          (base/"provenance.json").write_text(json.dumps({
              "git_sha":os.environ.get("GITHUB_SHA"),
              "experiment":experiment,
              "python_version":os.sys.version,
              "torch_version":torch.__version__,
              "train_data":"procedural Y-shaped vessel trees, NOT ImageCAS",
              "phase":"research-only, not clinical model"
          },indent=2)+"\n")
          print(json.dumps(report["independent_test_summary"],indent=2))
          PY
      - name: Upload trained weights and independent test report
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-ccta3d-${{ matrix.experiment }}-${{ github.sha }}
          path: evidence/pretrained_${{ matrix.experiment }}/
          retention-days: 90
          if-no-files-found: error
