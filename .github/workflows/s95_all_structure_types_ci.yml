name: S95 all observed bubble structures and operator quadratic guides
on:
  push:
    branches:
      - feature/bubble-s95-all-object-typing-operator-curves-2026-11-06
    paths:
      - 'bubble_chamber/s95_*.py'
      - 'scripts/research/bubble_chamber/physicists_s95_*.py'
      - 'tests/test_s95_*.py'
      - '.github/workflows/s95_all_structure_types_ci.yml'
      - 'docs/bubble_chamber/S95_*.md'
  pull_request:
    branches:
      - feature/bubble-s94-labels-guard-2026-11-06
    paths:
      - 'bubble_chamber/s95_*.py'
      - 'scripts/research/bubble_chamber/physicists_s95_*.py'
      - 'tests/test_s95_*.py'
      - '.github/workflows/s95_all_structure_types_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pixels-operator-curves-and-complete-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic research test dependencies only
        run: python -m pip install numpy scipy scikit-image opencv-python-headless==4.13.0.92 networkx scikit-learn pytest
      - name: S95 unit, synthetic all-objects image and S92-S94 regression
        run: >-
          python -m pytest -q
          tests/test_s95_operator_curves_and_types.py
          tests/test_s95_all_structure_review.py
          tests/test_s95_human_review.py
          tests/test_s94_sparse_keypoint_guard.py
          tests/test_s93_compact_real_overlay.py
          tests/test_s92_private_whole_bmp.py
          tests/test_s92_curve_geometry.py
      - name: S95 CLI and syntax
        run: |
          python -m compileall -q bubble_chamber/s95_operator_curves.py bubble_chamber/s95_all_structure_types.py bubble_chamber/s95_all_structures_review.py bubble_chamber/s95_human_review.py scripts/research/bubble_chamber/physicists_s95_all_classes.py scripts/research/bubble_chamber/physicists_s95_compile_human_review.py
          python scripts/research/bubble_chamber/physicists_s95_all_classes.py --help >/dev/null
          python scripts/research/bubble_chamber/physicists_s95_compile_human_review.py --help >/dev/null
      - name: Keep private original films and operator guides out of the repo
        run: |
          if git ls-files bubble_chamber/s95* tests/test_s95* docs/bubble_chamber/S95* | grep -Ei '\.(bmp|png|jpg|jpeg|pt|pth|npy|npz|zip|7z|json)$'; then
            echo 'No private bubble photos, human geometry packages or model weights permitted' >&2
            exit 1
          fi
