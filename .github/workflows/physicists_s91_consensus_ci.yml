name: Bubble-chamber S91 private blinded consensus and follow-up
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s91_review_consensus.py'
      - 'scripts/research/bubble_chamber/physicists_s91_consensus.py'
      - 'tests/test_s91_review_consensus.py'
      - 'docs/bubble_chamber/S91_PRIVATE_REVIEW_CONSENSUS_2026_10_29.md'
      - '.github/workflows/physicists_s91_consensus_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-only-consensus-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal image and geometry dependencies
        run: python -m pip install numpy scipy scikit-image opencv-python-headless pytest
      - name: Regress S86 through S91 on generated pixels only
        run: >-
          python -m pytest -q
          tests/test_full_bmp_segmentation.py
          tests/test_s87_seam_continuity.py
          tests/test_s88_weak_ridges.py
          tests/test_s89_private_candidate_audit.py
          tests/test_s90_physicist_review.py
          tests/test_s91_review_consensus.py
      - name: Compile and verify offline S91 CLI
        run: |
          python -m compileall -q bubble_chamber/s91_review_consensus.py scripts/research/bubble_chamber/physicists_s91_consensus.py
          python scripts/research/bubble_chamber/physicists_s91_consensus.py --help
      - name: Do not commit private images, opinions or model checkpoints
        shell: bash
        run: |
          if git ls-files 'bubble_chamber/s91_*' 'scripts/research/bubble_chamber/physicists_s91_*' 'tests/test_s91_*' 'docs/bubble_chamber/S91_*' | grep -Ei '\.(bmp|jpe?g|png|tif|tiff|7z|zip|pt|pth|ckpt|pkl|joblib|npy|npz|csv|ndjson)$'; then
            echo 'Private bubble chamber pixels, human responses or weights in public repo' >&2
            exit 1
          fi
