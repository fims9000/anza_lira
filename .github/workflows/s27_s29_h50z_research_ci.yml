name: H50Z S27-S29 ANZA review and geometric-tracing contracts
on:
  push:
    branches: [research/bubble-chamber-graph-lira]
    paths:
      - 'bubble_chamber/s27_*.py'
      - 'bubble_chamber/s28_*.py'
      - 'bubble_chamber/s29_*.py'
      - 'scripts/research/bubble_chamber/s27_*.py'
      - 'scripts/research/bubble_chamber/s28_*.py'
      - 'scripts/research/bubble_chamber/s29_*.py'
      - 'tests/test_s27_*.py'
      - 'tests/test_s28_*.py'
      - 'tests/test_s29_*.py'
      - '.github/workflows/s27_s29_h50z_research_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific CPU test dependencies
        run: python -m pip install torch numpy scipy opencv-python-headless scikit-image scikit-learn matplotlib pytest
      - name: Verify original models + no auto-human labels + source-photo SHA contracts
        run: python -m pytest -q tests/test_s27_*.py tests/test_s28_*.py tests/test_s29_*.py
      - name: User BMP and private reviewer must not enter repository
        run: |
          test ! -e private/H50Z_030_01_005.bmp
          test ! -e private/H50Z_030_01_006.bmp
          test ! -e S29_ANZA_2D_metrics_human_reviewer.html
