name: Tver V28 posthoc real F3 predicted ANZA SBPP topology CAL
on:
  push:
    branches:
      - research/tver-v28-topology-calibration-posthoc-20261114
    paths:
      - 'scripts/tver_v28_topology_calibration.py'
      - 'scripts/tver_v28_posthoc_real_e2e.py'
      - 'tests/test_tver_v28_topology_calibration.py'
      - 'scripts/verify_tver_v28_case_evidence.py'
      - 'docs/research/tver2026/V28_POSTHOC_TOPOLOGY_THRESHOLD_FROZEN_PROTOCOL_20261114.md'
      - '.github/workflows/tver-v28-real-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  posthoc_training_cal_only_topology:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual AZConv source and full predicted SBPP LIRA dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy scipy pillow scikit-image scikit-learn joblib pytest
      - name: Test thresholds against predicted TRAIN and CAL positive pairs
        run: |
          python -m compileall -q scripts/tver_v28_topology_calibration.py scripts/tver_v28_posthoc_real_e2e.py
          python -m pytest -q tests/test_tver_v26_predicted_pipeline.py tests/test_tver_v28_topology_calibration.py
      - uses: actions/cache@v4
        with:
          path: data/cracks/raw
          key: cracks-v2-6557236191763af7bd8298ecb136d41e-01e1697e886da2079ff3c1967334a7ca
      - name: Verify official image and expert annotation archives
        run: |
          python scripts/download_cracks_v2_public.py \
            --output data/cracks/raw \
            --receipt results/tver_v28/download_MD5.json
      - name: Run new AZConv and same U-Net on real TRAIN, select topology using CAL only
        run: |
          python -m scripts.tver_v28_posthoc_real_e2e \
            --images data/cracks/raw/images.zip \
            --annotations "data/cracks/raw/Fault segmentations.zip" \
            --out results/tver_v28/real
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/tver_v28/real')
          a=json.loads((p/'v28_topology_TRAIN_CAL_frozen.json').read_text())
          b=json.loads((p/'v28_summary.json').read_text())
          assert a['posthoc_after_V27_TEST_inspection']
          assert a['V28_TEST_images_labels_not_decoded_for_selection']
          assert b['status'] in (
            'V28_STOP_NOT_ALL_FRONTENDS_TOPOLOGY_TRAINABLE',
            'V28_POSTHOC_TOPOLOGY_ADAPTED_REAL_PREDICTED_E2E_EXECUTED')
          if b['status'].startswith('V28_STOP'):
            assert b['V28_TEST_images_not_opened']
          else:
            assert b['model_weight_SHA256_same_as_V27']
            assert b['historical_weights_UNAVAILABLE']
          PY
      - name: Independently verify threshold choice and all actual real F3 predicted-port link decisions
        run: |
          python scripts/verify_tver_v28_case_evidence.py             --root results/tver_v28/real
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/tver_v28/real/v28_independent_audit.json').read_text())
          assert r['status']=='V28_INDEPENDENT_POSTHOC_TOPOLOGY_REAL_E2E_CASE_AUDIT_PASS'
          assert r['both_new_LIRA_heads_trained_from_predicted_ports']
          assert r['both_frontends_source_and_correct_candidates_available_on_TEST']
          assert r['V28_topology_selected_only_from_TRAIN_CAL_rows']
          PY
      - name: Preserve code/source hash
        if: always()
        run: |
          mkdir -p results/tver_v28/real
          git rev-parse HEAD > results/tver_v28/real/COMMIT_SHA.txt
      - name: Upload original SHA-locked weights and all TRAIN CAL topology score cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tver-v28-posthoc-topology-predicted-sbpp
          path: |
            results/tver_v28/download_MD5.json
            results/tver_v28/real/v28_source_cohort.json
            results/tver_v28/real/v28_topology_TRAIN_CAL_frozen.json
            results/tver_v28/real/v28_summary.json
            results/tver_v28/real/v28_independent_audit.json
            results/tver_v28/real/new_train_model/*.pt
            results/tver_v28/real/new_train_model/v26_segmenter_frozen.json
            results/tver_v28/real/predicted_e2e/*.json
            results/tver_v28/real/predicted_e2e/*.csv
            results/tver_v28/real/predicted_e2e/*.joblib
            results/tver_v28/real/COMMIT_SHA.txt
          if-no-files-found: warn
          retention-days: 90
