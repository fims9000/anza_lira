name: S83 non-saturating per-line support (source-only CAL/TEST and safety)
on:
  push:
    branches:
      - research/bubble-chamber-graph-lira
    paths:
      - 'bubble_chamber/s83_*.py'
      - 'scripts/research/bubble_chamber/s83_*.py'
      - 'tests/test_s83_*.py'
      - 'docs/bubble_chamber/S83_*'
      - 'docs/bubble_chamber/EXPERIMENT_IDS_MACHINE_ONLY.json'
      - '.github/workflows/s83_unsaturated_line_support_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_only_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy scikit-image scikit-learn opencv-python-headless networkx pytest
      - name: CPU-only torch for unchanged frozen source scorer
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source-only S69 and S82/S83 frozen replay contracts, registry and native UNKNOWN
        run: python -m pytest -q tests/test_s69_orientation_invariant_audit.py tests/test_s82_local_instance_support.py tests/test_s82_public_receipts.py tests/test_s83_unsaturated_support.py tests/test_s83_protocol_integrity.py tests/test_s83_public_receipts.py
      - name: Verify S83 source syntax
        run: python -m compileall -q bubble_chamber/s83_unsaturated_local_support.py scripts/research/bubble_chamber/s83_calibrate_non_saturating.py scripts/research/bubble_chamber/s83_native_readonly_audit.py
      - name: Block native H50Z photos and model weights from S83 source paths
        shell: bash
        run: |
          if git ls-files 'bubble_chamber/s83*' 'scripts/research/bubble_chamber/s83*' 'tests/test_s83*' 'docs/bubble_chamber/S83*' | grep -Ei '\.(bmp|png|jpe?g|tif|7z|zip|pt|pth|ckpt|npy|npz)$'; then
            echo 'Native/private material is prohibited in S83 research sources' >&2
            exit 1
          fi
